name: Backend CI

on:
  pull_request:
    branches:
      - master
      - gfeat/upgrades
  push:
    branches:
      - master
      - gfeat/upgrades

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: Production Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        env:
          SALEOR_OYE_DEPLOY_KEY: ${{ secrets.SALEOR_OYE_DEPLOY_KEY }}
        run: |
          test -n "$SALEOR_OYE_DEPLOY_KEY"
          install -m 600 /dev/null /tmp/saleor_oye_deploy_key
          printf '%s\n' "$SALEOR_OYE_DEPLOY_KEY" > /tmp/saleor_oye_deploy_key
          eval "$(ssh-agent -s)"
          ssh-add /tmp/saleor_oye_deploy_key
          rm /tmp/saleor_oye_deploy_key
          DOCKER_BUILDKIT=1 docker build --pull --ssh "default=$SSH_AUTH_SOCK" --tag oye-saleor:ci .

      - name: Verify application imports
        run: |
          docker run --rm --entrypoint python oye-saleor:ci -c "import saleor; import saleor_oye"
          docker run --rm --entrypoint git oye-saleor:ci -C /app/src/saleor-oye rev-parse HEAD

      - name: Test installed OYE extension
        run: |
          docker run --rm --entrypoint python \
            -e SECRET_KEY=ci-only-secret \
            -e DJANGO_SETTINGS_MODULE=saleor_oye.tests.settings \
            -e IS_TESTING=True -e REMOTE=False \
            oye-saleor:ci -m pytest \
            /app/src/saleor-oye/saleor_oye/tests/test_withdrawals.py --no-migrations

      - name: Verify optional Python Brotli decoders
        run: |
          docker run --rm -i --entrypoint python oye-saleor:ci - <<'PY'
          from importlib.metadata import PackageNotFoundError, version
          from packaging.version import Version

          for package, minimum in (("Brotli", "1.2.1"), ("brotlicffi", "1.2.1.0")):
              try:
                  installed = version(package)
              except PackageNotFoundError:
                  print(f"{package}: not installed")
                  continue
              print(f"{package}: {installed}")
              assert Version(installed) >= Version(minimum), f"{package} requires >= {minimum}"
          PY
